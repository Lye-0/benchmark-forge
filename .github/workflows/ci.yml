name: Windows and Linux checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.13.5'
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - if: runner.os == 'Linux'
        run: bash scripts/setup.sh
      - if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/setup.ps1
      - if: runner.os == 'Linux'
        run: bash scripts/check.sh
      - if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/check.ps1
      - name: Inspect Windows GPU configuration (GPU optional)
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/diagnose.ps1 -Gpu
      - name: Check Windows CPU PyTorch runtime (no model inference)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          uv sync --locked --extra transformers
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --no-sync python -m llm_benchmark.torch_probe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify disposable Docker isolation
        if: runner.os == 'Linux'
        run: |
          docker pull python@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1
          FORGE_TEST_DOCKER=1 uv run pytest -q tests/test_sandbox.py
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run e2e
        working-directory: apps/web
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: failure()
        with:
          name: browser-failure-traces-${{ matrix.os }}
          path: apps/web/test-results
          retention-days: 3
